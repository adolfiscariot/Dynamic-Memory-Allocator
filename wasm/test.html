<!DOCTYPE html>
<html>
<body>
<script src="allocator.js"></script>
<script type="module">
import { initBridge, malloc, free, reset, snapshotHeap, snapshotFreeList } from './bridge.js';

await initBridge();

const p = malloc(64);
console.log('malloc(64) =', p);

const p2 = malloc(128);
console.log('malloc(128) =', p2);

const p3 = malloc(256);
console.log('malloc(256) =', p3);

console.log('heap snapshot:', snapshotHeap());
console.log('free list:', snapshotFreeList());

free(p);
console.log('after free(p):');
console.log('heap snapshot:', snapshotHeap());
console.log('free list:', snapshotFreeList());
</script>
</body>
</html>
